```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Connection Info</title>
<style>
:root {
  --bg: #0b0f17;
  --card: #141a26;
  --line: #233047;
  --txt: #e7edf7;
  --dim: #8fa0bd;
  --acc: #5eead4;
  --warn: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  width: 100%;
  max-width: 560px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px;
}
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
.notice {
  background: rgba(94, 234, 212, .08);
  border: 1px solid rgba(94, 234, 212, .25);
  color: var(--acc);
  font-size: 12.5px;
  padding: 10px 12px;
  border-radius: 10px;
  margin-bottom: 18px;
  line-height: 1.5;
}
.notice.warn {
  background: rgba(251, 191, 36, .08);
  border-color: rgba(251, 191, 36, .3);
  color: var(--warn);
}
.btn {
  display: block;
  width: 100%;
  background: var(--acc);
  color: #08312b;
  font-weight: 700;
  font-size: 15px;
  border: 0;
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  margin-bottom: 10px;
}
.btn:disabled { opacity: .45; cursor: default; }
.status {
  color: var(--dim);
  font-size: 12.5px;
  margin: 0 0 16px;
  min-height: 1em;
}
.status.ok { color: var(--acc); }
.status.err { color: #f87171; }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.item {
  background: #0f1520;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
}
.item.wide { grid-column: 1 / -1; }
.k {
  color: var(--dim);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 4px;
}
.v { font-size: 14px; word-break: break-all; }
.v.big { font-size: 17px; font-weight: 600; }
.foot {
  margin-top: 16px;
  color: var(--dim);
  font-size: 11.5px;
  text-align: center;
}
@media (max-width: 480px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="card">
  <h1>Your Connection Info</h1>
  <p class="sub">Everything runs in your browser.</p>
  <p class="notice" id="notice">
    This page shows information about your own connection.
    Nothing is sent to anyone unless you choose to share it.
  </p>
  <button id="shareBtn" class="btn" style="display:none">
    Copy my connection info
  </button>
  <p class="status" id="shareStatus" aria-live="polite"></p>
  <div class="grid" id="grid">
    <div class="item wide"><div class="v">Loading…</div></div>
  </div>
  <p class="foot" id="src"></p>
</div>

<script>
var $grid = document.getElementById('grid');
var $notice = document.getElementById('notice');
var $shareBtn = document.getElementById('shareBtn');
var $shareStatus = document.getElementById('shareStatus');

var info = null;

function item(label, value, wide) {
  if (value === undefined || value === null || value === '') return null;

  var el = document.createElement('div');
  el.className = 'item' + (wide ? ' wide' : '');

  var k = document.createElement('div');
  k.className = 'k';
  k.textContent = label;

  var v = document.createElement('div');
  v.className = 'v' + (wide ? ' big' : '');
  v.textContent = String(value);

  el.append(k, v);
  return el;
}

async function getData() {
  try {
    var r = await fetch('https://ipwho.is/', { cache: 'no-store' });
    if (!r.ok) throw new Error('Primary API request failed');

    var d = await r.json();
    if (!d || d.success === false) throw new Error('Primary API failed');

    return { d: d, src: 'ipwho.is' };
  } catch (e) {
    var r2 = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
    if (!r2.ok) throw new Error('Fallback API request failed');

    var d2 = await r2.json();
    return { d: d2, src: 'ipapi.co' };
  }
}

function normalize(d, src) {
  if (src === 'ipwho.is') {
    return {
      ip: d.ip,
      flag: d.flag && d.flag.emoji ? d.flag.emoji + ' ' : '',
      country: d.country,
      code: d.country_code,
      capital: d.capital,
      region: d.region,
      city: d.city,
      postal: d.postal,
      lat: d.latitude,
      lon: d.longitude,
      tz: d.timezone && d.timezone.id,
      isp: d.connection && d.connection.isp,
      org: d.connection && d.connection.org,
      asn: d.connection && d.connection.asn,
      domain: d.connection && d.connection.domain,
      continent: d.continent
    };
  }

  return {
    ip: d.ip,
    flag: '',
    country: d.country_name,
    code: d.country_code,
    capital: d.country_capital,
    region: d.region,
    city: d.city,
    postal: d.postal,
    lat: d.latitude,
    lon: d.longitude,
    tz: d.timezone,
    isp: d.org,
    org: d.org,
    asn: d.asn,
    domain: '',
    continent: d.continent_code
  };
}

async function loadInfo() {
  try {
    var res = await getData();
    info = normalize(res.d, res.src);

    var values = [
      ['IP address', info.ip, true],
      ['City', info.city],
      ['Region / state', info.region],
      ['Country', (info.flag || '') + (info.country || '') +
        (info.code ? ' (' + info.code + ')' : '')],
      ['Capital', info.capital],
      ['Latitude', info.lat],
      ['Longitude', info.lon],
      ['Postal code', info.postal],
      ['Timezone', info.tz],
      ['ISP / provider', info.isp, true],
      ['Organization', info.org],
      ['ASN', info.asn],
      ['Continent', info.continent],
      ['Domain', info.domain]
    ];

    $grid.replaceChildren();

    values.forEach(function(entry) {
      var el = item(entry[0], entry[1], entry[2]);
      if (el) $grid.appendChild(el);
    });

    if (!$grid.children.length) {
      $grid.textContent = 'Could not read your connection info.';
    }

    document.getElementById('src').textContent =
      'Data source: ' + res.src;

    $shareBtn.style.display = 'block';
  } catch (e) {
    $grid.replaceChildren();

    var errorItem = document.createElement('div');
    errorItem.className = 'item wide';
    errorItem.textContent =
      'Could not load your connection info. Try refreshing the page.';

    $grid.appendChild(errorItem);
  }
}

async function SHARE() {
  if (!info) {
    $shareStatus.className = 'status err';
    $shareStatus.textContent = 'Connection info is not ready yet.';
    return false;
  }

  var text = Object.entries(info)
    .filter(function(entry) {
      return entry[1] !== undefined &&
             entry[1] !== null &&
             entry[1] !== '';
    })
    .map(function(entry) {
      return entry[0] + ': ' + entry[1];
    })
    .join('\n');

  try {
    await navigator.clipboard.writeText(text);
    $shareStatus.className = 'status ok';
    $shareStatus.textContent = 'Connection info copied to clipboard.';
    return true;
  } catch (e) {
    $shareStatus.className = 'status err';
    $shareStatus.textContent =
      'Clipboard access failed. Check your browser permissions.';
    return false;
  }
}
loadInfo().then(function() {
  SHARE();
});
</script>
</body>
</html>
